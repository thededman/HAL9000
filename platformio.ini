; HAL 9000 desk companion — M5Stack CoreS3
; Build + flash:   pio run -e cores3 -t upload
; Logic tests:     pio test -e native

[platformio]
default_envs = cores3

[env:cores3]
platform = espressif32
board = m5stack-cores3
framework = arduino
monitor_speed = 115200
build_unflags = -std=gnu++11
build_flags = -std=gnu++17 -DCORE_DEBUG_LEVEL=1
lib_deps =
    m5stack/M5Unified@0.3.0
    m5stack/M5GFX@0.3.0
build_src_filter = +<*> -<linux/> -<friend/>   ; HAL Zero's glue lives in src/linux/, the friends' in src/friend/
test_ignore = *

[env:native]
platform = native
test_framework = unity
build_flags = -std=c++17 -Wall
lib_ignore = hal_ui   ; logic tests only: no drawing code

; HAL Zero: the Cardputer Zero app, and the same app in a window on the Mac.
; Needs SDL2 (macOS: brew install sdl2; Debian: apt install libsdl2-dev).
[desktop]
platform = native
lib_deps = m5stack/M5GFX@0.3.0
build_src_filter = -<*> +<linux/>
build_flags =
    -std=c++17
    -O2
    -Wall
    -Wno-unused-function
    !sdl2-config --cflags
    !sdl2-config --libs
test_ignore = *

[env:sim]
extends = desktop

[env:cardputer]
extends = desktop

; The friends (optional, v0.7): one firmware in src/friend/, a folder for each board.
;   HAL Nano  (M5StickC Plus2):  pio run -e nano -t upload
; Each builds the shared part, his own folder, and the desk HAL's link server.
[friend]
platform = espressif32
framework = arduino
monitor_speed = 115200
build_unflags = -std=gnu++11
build_flags = -std=gnu++17 -DCORE_DEBUG_LEVEL=1
lib_deps =
    m5stack/M5Unified@0.3.0
    m5stack/M5GFX@0.3.0
test_ignore = *

[env:nano]
extends = friend
board = m5stick-c
board_build.variant = m5stack_stickc_plus2   ; the board file names a pin folder that has since been renamed
board_upload.flash_size = 8MB                ; the Plus2 has 8 MB: the 4 MB layout is too small for him
board_upload.maximum_size = 8388608
board_build.partitions = default_8MB.csv
build_src_filter = -<*> +<friend/common/> +<friend/nano/> +<link_server.cpp> +<hal_log_arduino.cpp>
